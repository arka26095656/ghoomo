# Local Postgres + API, so you can test the same database you'll deploy with.
# Usage: docker compose up --build    then run the frontend with `npm run dev` in ./frontend
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ghoomo
      POSTGRES_USER: ghoomo
      POSTGRES_PASSWORD: ghoomo
    ports:
      - "5432:5432"
    volumes:
      - ghoomo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghoomo"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ghoomo
      DATABASE_USERNAME: ghoomo
      DATABASE_PASSWORD: ghoomo
      JWT_SECRET: local-docker-secret-change-me-0123456789abcdef
      CORS_ORIGINS: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  ghoomo-db:
